<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generator de teren</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; max-width: 1200px; background: #fafafa; color: #222; }
    .controls { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
    label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
    select, input, button { font-size: 15px; padding: 6px 10px; }
    #presetDesc { color: #666; font-size: 14px; }
    #status { font-weight: 600; }
    .imgs { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
    .imgs img { max-width: 100%; height: 360px; object-fit: contain; background: #ddd; }
    table { border-collapse: collapse; }
    th, td { text-align: left; padding: 4px 12px 4px 0; border-bottom: 1px solid #e5e5e5; font-size: 14px; vertical-align: top; }
    th { font-weight: 500; color: #555; }
    #history li { cursor: pointer; padding: 2px 0; }
    #history li:hover { text-decoration: underline; }
  </style>
</head>
<body>
<h1>Generator de teren</h1>

<div class="controls">
  <label>Tip de teren <select id="preset"></select></label>
  <label>Seed <input id="seed" type="number" min="1" placeholder="aleator"></label>
  <button id="go">Generează</button>
  <button id="rnd">Seed aleator</button>
</div>
<p id="presetDesc"></p>

<p id="status"></p>
<div class="imgs" id="imgs" hidden>
  <img id="top" alt="vedere de sus">
  <img id="oblique" alt="vedere oblică">
</div>
<table id="metrics"></table>

<h2>Istoric</h2>
<ul id="history"></ul>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (v, d = 1) => v == null ? '–' : Number(v).toFixed(d);
  const pct = v => v == null ? '–' : (v * 100).toFixed(1) + '%';
  const stateRo = { Queued: 'în coadă', Running: 'rulează', Done: 'gata', Failed: 'eșuat', Rejected: 'respins' };

  let presets = [];
  let pollTimer = null;

  async function getJson(url, opts) {
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  async function loadPresets() {
    presets = await getJson('/api/presets');
    $('preset').innerHTML = presets.map(p => `<option value="${esc(p.name)}">${esc(p.label || p.name)}</option>`).join('');
    if (presets.some(p => p.name === 'deal')) $('preset').value = 'deal';
    showPresetDesc();
  }

  function showPresetDesc() {
    const p = presets.find(p => p.name === $('preset').value);
    $('presetDesc').textContent = p?.description ?? '';
  }

  async function generate() {
    const seed = $('seed').value ? Number($('seed').value) : null;
    try {
      const run = await getJson('/api/runs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ preset: $('preset').value, seed })
      });
      show(run);
      poll(run.id);
      loadHistory();
    } catch (e) {
      $('status').textContent = 'Eroare: ' + e.message;
    }
  }

  function poll(id) {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      const run = await getJson('/api/runs/' + id);
      show(run);
      if (run.state !== 'Queued' && run.state !== 'Running') {
        clearInterval(pollTimer);
        loadHistory();
      }
    }, 500);
  }

  function show(run) {
    let s = `#${run.id} · ${run.preset} · seed ${run.seed}`;
    if (run.seed !== run.requestedSeed) s += ` (cerut ${run.requestedSeed})`;
    s += ` · ${stateRo[run.state] ?? run.state}`;
    if (run.attempts > 1) s += ` · încercarea ${run.attempts}`;
    if (run.message) s += ` · ${run.message}`;
    $('status').textContent = s;

    $('imgs').hidden = !run.images;
    if (run.images) {
      if ($('top').getAttribute('src') !== run.images.top) $('top').src = run.images.top;
      if ($('oblique').getAttribute('src') !== run.images.oblique) $('oblique').src = run.images.oblique;
    }
    renderMetrics(run.metrics);
  }

  function renderMetrics(m) {
    if (!m) { $('metrics').innerHTML = ''; return; }
    const relief = m.reliefM || 1;
    const meters = v => num(v * relief) + ' m';
    const bands = ['0–5°', '5–15°', '15–30°', '30–45°', '45°+']
      .map((b, i) => `${b}: ${pct(m.slopeBands?.[i])}`).join(' · ');
    const targets = !m.targetsChecked ? 'neverificate'
      : (m.targetFails?.length ? m.targetFails.join('; ') : 'în interval');

    const rows = [
      ['Hash', m.heightHash],
      ['Durată', m.durationMs + ' ms'],
      ['Teren', `${num(m.terrainSizeM, 0)} × ${num(m.terrainSizeM, 0)} m, relief ${num(relief, 0)} m`],
      ['Nivelul apei', m.waterHeight > 0 ? meters(m.waterHeight) : 'fără apă'],
      ['Înălțime min / medie / max', `${meters(m.minHeight)} / ${meters(m.meanHeight)} / ${meters(m.maxHeight)}`],
      ['Deviație standard', meters(m.heightStdDev)],
      ['P10 / P50 / P90', `${meters(m.heightP10)} / ${meters(m.heightP50)} / ${meters(m.heightP90)}`],
      ['Pantă medie', num(m.meanSlopeDeg) + '°'],
      ['Distribuția pantelor', bands],
      ['Ținte', targets]
    ];
    $('metrics').innerHTML = rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
  }

  async function loadHistory() {
    const runs = await getJson('/api/runs');
    $('history').innerHTML = runs.map(r =>
      `<li data-id="${r.id}">#${r.id} · ${esc(r.preset)} · seed ${r.seed} · ${stateRo[r.state] ?? r.state}` +
      (r.heightHash ? ` · ${r.heightHash}` : '') + '</li>').join('');
  }

  $('history').onclick = async e => {
    const li = e.target.closest('li');
    if (!li) return;
    clearInterval(pollTimer);
    show(await getJson('/api/runs/' + li.dataset.id));
  };
  $('preset').onchange = showPresetDesc;
  $('go').onclick = generate;
  $('rnd').onclick = () => { $('seed').value = Math.floor(Math.random() * 999999) + 1; generate(); };

  loadPresets();
  loadHistory();
</script>
</body>
</html>
