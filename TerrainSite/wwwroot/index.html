<!doctype html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Procedural World Generator</title>
    <style>
        :root { --bg:#f4f2ee; --card:#fff; --text:#1d1d1b; --muted:#6b6a65; --accent:#3b6d11; --border:#ddd9d0; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
        main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
        h1 { font-size: 22px; font-weight: 600; margin: 0 0 16px; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
        .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        input { font:inherit; padding:8px 10px; border:1px solid var(--border); border-radius:8px; width:160px; }
        button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
        button.ghost { background:transparent; color:var(--accent); }
        button:disabled { opacity:.5; cursor:default; }
        #status { color:var(--muted); margin-left:8px; }
        .images { display:grid; grid-template-columns: 1fr 1.6fr; gap:12px; }
        .images img { width:100%; border-radius:8px; border:1px solid var(--border); background:#e9e6df; }
        table { border-collapse: collapse; width:100%; }
        td { padding:6px 4px; border-bottom:1px solid var(--border); }
        td:last-child { text-align:right; font-variant-numeric: tabular-nums; }
        #history li { cursor:pointer; padding:4px 0; color:var(--muted); }
        #history li:hover { color:var(--text); }
        @media (max-width: 700px) { .images { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <h1>Procedural World Generator</h1>

    <div class="card row">
        <input id="seed" type="number" placeholder="seed (gol = aleator)">
        <button id="go">Generează</button>
        <button id="random" class="ghost">Seed aleator</button>
        <span id="status"></span>
    </div>

    <div class="card" id="result" hidden>
        <div class="images">
            <img id="top" alt="vedere de sus">
            <img id="oblique" alt="vedere oblică">
        </div>
    </div>

    <div class="card" id="metricsCard" hidden>
        <table id="metrics"></table>
    </div>

    <div class="card">
        <strong>Istoric</strong>
        <ul id="history"></ul>
    </div>
</main>

<script>
    // only the ids of the elements i need
    const $ = id => document.getElementById(id);
    let timer = null;

    async function generate(seed) {
        $('go').disabled = true;
        const res = await fetch('/api/runs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ seed })
        });
        const { id } = await res.json();
        watch(id);
    }

    // asking the server every half second until the run is finished
    function watch(id) {
        clearInterval(timer);
        timer = setInterval(() => refresh(id), 500);
        refresh(id);
    }

    async function refresh(id) {
        const run = await (await fetch('/api/runs/' + id)).json();
        show(run);
        if (['Done', 'Failed', 'Rejected'].includes(run.state)) {
            clearInterval(timer);
            $('go').disabled = false;
            loadHistory();
        }
    }

    const labels = { Queued: 'în coadă…', Running: 'se generează…', Done: 'gata', Failed: 'eroare', Rejected: 'respins' };

    function show(run) {
        let text = `#${run.id} · seed ${run.seed} · ${labels[run.state] ?? run.state}`;
        if (run.message) text += ` (${run.message})`;
        $('status').textContent = text;

        $('result').hidden = !run.images;
        if (run.images) {
            $('top').src = run.images.top;
            $('oblique').src = run.images.oblique;
        }

        $('metricsCard').hidden = !run.metrics;
        if (run.metrics) {
            const m = run.metrics, f = (v, d = 3) => Number(v).toFixed(d);
            const bands = ['0–5°', '5–15°', '15–30°', '30–45°', '45°+'];
            const rows = [
                ['Hash', m.heightHash],
                ['Durată', f(m.durationMs, 0) + ' ms'],
                ['Înălțime min / medie / max', `${f(m.minHeight)} / ${f(m.meanHeight)} / ${f(m.maxHeight)}`],
                ['Deviație standard', f(m.heightStdDev)],
                ['P10 / P50 / P90', `${f(m.heightP10)} / ${f(m.heightP50)} / ${f(m.heightP90)}`],
                ['Pantă medie', f(m.meanSlopeDeg, 1) + '°'],
                ...m.slopeBands.map((v, i) => ['Pantă ' + bands[i], f(v, 1) + '%'])
            ];
            $('metrics').innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
        }
    }

    async function loadHistory() {
        const runs = await (await fetch('/api/runs')).json();
        $('history').innerHTML = runs.map(r =>
            `<li data-id="${r.id}">#${r.id} · seed ${r.seed} · ${labels[r.state] ?? r.state}</li>`).join('');
    }

    $('history').addEventListener('click', e => { if (e.target.dataset.id) watch(e.target.dataset.id); });
    $('go').addEventListener('click', () => {
        const v = $('seed').value.trim();
        generate(v === '' ? null : parseInt(v));
    });
    $('random').addEventListener('click', () => { $('seed').value = ''; generate(null); });

    loadHistory();
</script>
</body>
</html>
